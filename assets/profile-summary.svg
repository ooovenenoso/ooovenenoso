<svg width="840" height="250" viewBox="0 0 840 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ooovenenoso profile summary</title>
  <desc id="desc">Dark summary card showing original public repos, followers, stars, forks, and operating focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#120c18"/>
      <stop offset="1" stop-color="#1d102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="880" height="290" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="816" height="226" rx="22" fill="url(#bg)" stroke="#37224f" filter="url(#shadow)"/>
  <rect x="36" y="36" width="150" height="30" rx="15" fill="#251336"/>
  <text x="56" y="56" fill="#ff77b7" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">LIVE SUMMARY</text>

  <text x="36" y="100" fill="#f5f3ff" font-size="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">Original builds, not fork theater.</text>
  <text x="36" y="128" fill="#c4b5fd" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Public profile pulse generated from current GitHub account data.</text>

  <g>
    <rect x="36" y="160" width="175" height="56" rx="16" fill="#181022" stroke="#342145"/>
    <text x="54" y="183" fill="#f9a8d4" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">ORIGINAL PUBLIC REPOS</text>
    <text x="54" y="206" fill="#ffffff" font-size="28" font-family="JetBrains Mono,Consolas,monospace" font-weight="800">30</text>
  </g>
  <g>
    <rect x="224" y="160" width="132" height="56" rx="16" fill="#181022" stroke="#342145"/>
    <text x="242" y="183" fill="#93c5fd" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">FOLLOWERS</text>
    <text x="242" y="206" fill="#ffffff" font-size="28" font-family="JetBrains Mono,Consolas,monospace" font-weight="800">55</text>
  </g>
  <g>
    <rect x="369" y="160" width="132" height="56" rx="16" fill="#181022" stroke="#342145"/>
    <text x="387" y="183" fill="#fcd34d" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">STARS</text>
    <text x="387" y="206" fill="#ffffff" font-size="28" font-family="JetBrains Mono,Consolas,monospace" font-weight="800">381</text>
  </g>
  <g>
    <rect x="514" y="160" width="132" height="56" rx="16" fill="#181022" stroke="#342145"/>
    <text x="532" y="183" fill="#86efac" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">FORKS</text>
    <text x="532" y="206" fill="#ffffff" font-size="28" font-family="JetBrains Mono,Consolas,monospace" font-weight="800">37</text>
  </g>

  <g>
    <rect x="670" y="36" width="130" height="180" rx="18" fill="#17101f" stroke="#342145"/>
    <text x="688" y="66" fill="#f5f3ff" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">Operating fields</text>
    <text x="688" y="95" fill="#d8b4fe" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">• bots + webhooks</text>
    <text x="688" y="118" fill="#d8b4fe" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">• payload hygiene</text>
    <text x="688" y="141" fill="#d8b4fe" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">• civic / ops tools</text>
    <text x="688" y="164" fill="#d8b4fe" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">• game/community</text>
    <text x="688" y="187" fill="#d8b4fe" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">• AI when useful</text>
  </g>
</svg>
