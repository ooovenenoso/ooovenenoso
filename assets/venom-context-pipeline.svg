<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ooovenenoso signal map</title>
  <desc id="desc">Dark profile hero showing live pulse panels, original build lanes, and digital piranhas routing fresh context into useful agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#0a0f17"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22ff99" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#22ff99" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22ff99" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff335f" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#ff335f" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff335f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131d"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .tiny{font-size:15px;letter-spacing:.22em;text-transform:uppercase}
      .micro{font-size:13px;letter-spacing:.18em;text-transform:uppercase}
      .title{font-size:26px;font-weight:800}
      .label{font-size:18px;font-weight:700}
      .small{font-size:14px}
      .muted{fill:#8da2b8}
      .card{fill:url(#card);stroke:#1dff99;stroke-opacity:.18;stroke-width:1.2}
      .pipe{stroke:#22ff99;stroke-width:3;stroke-linecap:round;stroke-dasharray:5 10;opacity:.8}
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="#1dff99" stroke-opacity="0.12"/>
  <circle cx="620" cy="198" r="185" fill="url(#glowGreen)"/>
  <circle cx="960" cy="106" r="120" fill="url(#glowRed)"/>

  <text x="66" y="56" class="mono tiny muted">ooovenenoso · live github signal</text>
  <text x="66" y="104" class="sans title" fill="#edf6ff">Less stale prose. More live pulse.</text>
  <text x="66" y="135" class="mono small muted">original builds · bots · payload research · game tooling · civic ops · applied ai</text>

  <g transform="translate(66 176)">
    <rect class="card" width="254" height="54" rx="14"/>
    <circle cx="28" cy="27" r="6" fill="#22ff99" filter="url(#shadow)"/>
    <text x="48" y="24" class="mono micro" fill="#22ff99">lane 01</text>
    <text x="48" y="39" class="sans label" fill="#edf6ff">security / payloads</text>
  </g>
  <g transform="translate(66 244)">
    <rect class="card" width="254" height="54" rx="14"/>
    <circle cx="28" cy="27" r="6" fill="#8b5cf6" filter="url(#shadow)"/>
    <text x="48" y="24" class="mono micro" fill="#8b5cf6">lane 02</text>
    <text x="48" y="39" class="sans label" fill="#edf6ff">bots / messaging</text>
  </g>
  <g transform="translate(66 312)">
    <rect class="card" width="254" height="54" rx="14"/>
    <circle cx="28" cy="27" r="6" fill="#ffb020" filter="url(#shadow)"/>
    <text x="48" y="24" class="mono micro" fill="#ffb020">lane 03</text>
    <text x="48" y="39" class="sans label" fill="#edf6ff">ops / games / web</text>
  </g>

  <path class="pipe" d="M334 202 C415 202 468 202 520 202"/>
  <path class="pipe" d="M334 270 C430 266 474 244 520 220"/>
  <path class="pipe" d="M334 338 C432 320 482 258 520 228"/>

  <g transform="translate(476 116)">
    <circle cx="130" cy="96" r="80" fill="#131a24" stroke="#22ff99" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="130" cy="96" r="104" stroke="#22ff99" stroke-opacity="0.12" stroke-width="2"/>
    <text x="130" y="82" text-anchor="middle" font-size="68">🐍</text>
    <text x="130" y="126" text-anchor="middle" class="sans title" fill="#edf6ff">digital piranhas</text>
    <text x="130" y="152" text-anchor="middle" class="mono small" fill="#22ff99">filter noise → ship signal</text>
  </g>

  <path class="pipe" d="M712 212 C770 212 812 212 846 212"/>
  <polygon points="846,212 826,200 826,224" fill="#22ff99"/>

  <g transform="translate(846 82)">
    <rect class="card" width="288" height="256" rx="22"/>
    <text x="28" y="34" class="mono micro" fill="#22ff99">live pulse panels</text>
    <g transform="translate(28 58)">
      <rect width="232" height="34" rx="10" fill="#0c1119" stroke="#283241"/>
      <text x="16" y="22" class="mono small" fill="#edf6ff">followers</text>
      <rect x="144" y="10" width="76" height="14" rx="7" fill="#1b2432"/>
      <rect x="144" y="10" width="60" height="14" rx="7" fill="#22ff99"/>
    </g>
    <g transform="translate(28 104)">
      <rect width="232" height="34" rx="10" fill="#0c1119" stroke="#283241"/>
      <text x="16" y="22" class="mono small" fill="#edf6ff">activity</text>
      <rect x="144" y="10" width="76" height="14" rx="7" fill="#1b2432"/>
      <rect x="144" y="10" width="66" height="14" rx="7" fill="#ff335f"/>
    </g>
    <g transform="translate(28 150)">
      <rect width="232" height="34" rx="10" fill="#0c1119" stroke="#283241"/>
      <text x="16" y="22" class="mono small" fill="#edf6ff">repos</text>
      <rect x="144" y="10" width="76" height="14" rx="7" fill="#1b2432"/>
      <rect x="144" y="10" width="70" height="14" rx="7" fill="#8b5cf6"/>
    </g>
    <g transform="translate(28 196)">
      <rect width="232" height="34" rx="10" fill="#0c1119" stroke="#283241"/>
      <text x="16" y="22" class="mono small" fill="#edf6ff">stars</text>
      <rect x="144" y="10" width="76" height="14" rx="7" fill="#1b2432"/>
      <rect x="144" y="10" width="54" height="14" rx="7" fill="#ffb020"/>
    </g>
  </g>

  <text x="600" y="392" text-anchor="middle" class="mono tiny" fill="#22ff99">github cards · dynamic badges · original-build lanes · agent-ready context</text>
</svg>
